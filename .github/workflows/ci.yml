name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Enforce offline data-governance core
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          banned = {"asyncio", "http", "requests", "socket", "subprocess", "urllib"}
          for path in [Path("src/datagovops/models.py"), Path("src/datagovops/registry.py"), Path("src/datagovops/validation.py")]:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import): roots = {a.name.split('.')[0] for a in node.names}
                  elif isinstance(node, ast.ImportFrom) and node.module: roots = {node.module.split('.')[0]}
                  else: continue
                  if roots & banned: raise SystemExit(f"{path}: forbidden capability import")
          PY

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build && python -m build
      - run: |
          python -m venv /tmp/datagovops-smoke
          /tmp/datagovops-smoke/bin/python -m pip install dist/*.whl
          /tmp/datagovops-smoke/bin/python - <<'PY'
          import datagovops
          from datagovops.validation import DataAssetValidator
          assert datagovops.__version__ == "0.1.0"
          assert DataAssetValidator is not None
          PY
