name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q src
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          for path in sorted(Path("schemas").glob("*.schema.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              jsonschema.Draft202012Validator.check_schema(schema)
              print(path)
          PY
      - name: Enforce offline data-governance core
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          banned = {"asyncio", "http", "requests", "socket", "subprocess", "urllib"}
          paths = [
              Path("src/datagovops/models.py"),
              Path("src/datagovops/registry.py"),
              Path("src/datagovops/semantic.py"),
              Path("src/datagovops/lineage.py"),
              Path("src/datagovops/quality.py"),
              Path("src/datagovops/access_retention.py"),
              Path("src/datagovops/access_retention_strict.py"),
              Path("src/datagovops/reporting.py"),
              Path("src/datagovops/reporting_strict.py"),
              Path("src/datagovops/bcbs239.py"),
              Path("src/datagovops/security.py"),
              Path("src/datagovops/evidence_integrity.py"),
              Path("src/datagovops/audit_recovery.py"),
              Path("src/datagovops/dossier.py"),
              Path("src/datagovops/dossier_release.py"),
              Path("src/datagovops/dossier_release_strict.py"),
              Path("src/datagovops/dossier_verify.py"),
              Path("src/datagovops/dossier_v02.py"),
              Path("src/datagovops/dossier_verify_v02.py"),
              Path("src/datagovops/_release_v02.py"),
              Path("src/datagovops/cli.py"),
              Path("src/datagovops/validation.py"),
          ]
          for path in paths:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      roots = {alias.name.split(".")[0] for alias in node.names}
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      roots = {node.module.split(".")[0]}
                  else:
                      continue
                  if roots & banned:
                      raise SystemExit(f"{path}: forbidden capability import")
          PY

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip install build && python -m build --wheel
      - name: Clean-wheel smoke
        run: |
          python -m venv /tmp/datagovops-smoke
          /tmp/datagovops-smoke/bin/python -m pip install dist/*.whl
          /tmp/datagovops-smoke/bin/python - <<'PY'
          import datagovops
          from datagovops import (
              AccessRetentionPrivacyRegistry,
              BCBS239AssuranceRegistry,
              DataAssetRegistry,
              DataAssetValidator,
              EvidenceKeyReference,
              GovernanceDossierBuilder,
              IdentityPolicy,
              InstitutionContext,
              LineageRegistry,
              QualityRegistry,
              RecoveryPolicy,
              ReportingGovernanceRegistry,
              SemanticGovernanceRegistry,
              SigningKeyReference,
              assess_recovery,
              build_dependency_sbom,
              verify_dossier_document,
          )

          assert datagovops.__version__ == "0.6.0"
          assert DataAssetRegistry is not None
          assert DataAssetValidator is not None
          assert SemanticGovernanceRegistry is not None
          assert LineageRegistry is not None
          assert QualityRegistry is not None
          assert AccessRetentionPrivacyRegistry is not None
          assert ReportingGovernanceRegistry is not None
          assert BCBS239AssuranceRegistry is not None
          assert InstitutionContext is not None
          assert IdentityPolicy is not None
          assert EvidenceKeyReference is not None
          assert SigningKeyReference is not None
          assert build_dependency_sbom is not None
          assert RecoveryPolicy is not None
          assert assess_recovery is not None
          assert GovernanceDossierBuilder is not None
          assert verify_dossier_document is not None
          print(datagovops.__version__)
          PY
          /tmp/datagovops-smoke/bin/datagovops --version
          printf '{"b":2,"a":1}\n' > /tmp/document.json
          /tmp/datagovops-smoke/bin/datagovops digest /tmp/document.json
          printf '{"$schema":"https://json-schema.org/draft/2020-12/schema","type":"object","additionalProperties":false,"required":["a"],"properties":{"a":{"type":"integer"}}}\n' > /tmp/schema.json
          printf '{"a":1}\n' > /tmp/schema-document.json
          /tmp/datagovops-smoke/bin/datagovops schema /tmp/schema.json /tmp/schema-document.json
