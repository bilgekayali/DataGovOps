name: Publish DataGovOps v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.1.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact release target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: c75570027d9845fe07d9c7abf8e9ce86c95af9dc
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}" --silent

      - name: Create or verify v0.1.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
          TARGET_SHA: c75570027d9845fe07d9c7abf8e9ce86c95af9dc
        run: |
          set -euo pipefail
          if ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null)"; then
            ref_type="$(printf '%s' "$ref_json" | jq -r '.object.type')"
            ref_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha')"
            if [ "$ref_type" != "commit" ] || [ "$ref_sha" != "$TARGET_SHA" ]; then
              echo "Existing ${TAG} does not point directly to ${TARGET_SHA}." >&2
              exit 1
            fi
            echo "${TAG} already exists at the approved target."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${TARGET_SHA}" >/dev/null
            echo "Created ${TAG} at ${TARGET_SHA}."
          fi

      - name: Publish or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## DataGovOps v0.1.0 — Foundation Release

          DataGovOps v0.1.0 establishes the first executable foundation for an evidence-backed data-governance control plane.

          ### Included foundation capabilities
          - authoritative institution-scoped data asset, principal and source-system inventory;
          - immutable asset versions and explicit ownership/accountability references;
          - classification, critical data element and business-purpose evidence;
          - exact asset/data-element lineage, transformation and provenance evidence;
          - deterministic data-quality rules, observations, findings, remediation and retest evidence;
          - access-purpose approvals and grants, retention schedules, legal holds and deletion-eligibility evidence;
          - privacy/security/data-residency obligation mappings and location evidence;
          - deterministic governance dossier generation with explicit gaps, exceptions and revalidation-required state;
          - hardened offline dossier verification with artifact/domain/schema/institution integrity checks;
          - `datagovops` CLI for version, digest, schema validation and dossier verification;
          - Python 3.11/3.12/3.13 CI, strict Draft 2020-12 schemas, wheel build and clean-wheel CLI smoke.

          ### Assurance boundary
          This release provides governance and integrity evidence. It does not by itself establish BCBS 239, GDPR, KVKK, BDDK, SPK or ISO compliance; lawful basis; regulatory applicability; objective data quality; deletion execution; IAM/runtime enforcement; source authenticity/non-repudiation; regulator acceptance; or production fitness.

          Release target: `c75570027d9845fe07d9c7abf8e9ce86c95af9dc`.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DataGovOps v0.1.0" \
            --notes-file /tmp/release-notes.md \
            --prerelease
