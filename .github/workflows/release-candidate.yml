name: Release Candidate

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install candidate and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Emit and verify frozen release contract
        run: python tools/release_contract.py --emit --verify
      - name: Run release-contract regression tests
        run: python -m unittest tests.test_contracts -v
      - name: Verify compatibility and governance policy documents
        run: |
          test -s COMPATIBILITY.md
          test -s release/release-contract.json
          test -s release/repository-governance.json
          grep -F 'enforcement_verified' release/repository-governance.json
          grep -F 'requires_human_release_decision' release/release-contract.json
      - name: Build release-candidate wheel
        run: python -m pip install build && python -m build --wheel
      - name: Clean-wheel release-candidate smoke
        run: |
          python -m venv /tmp/datagovops-rc
          /tmp/datagovops-rc/bin/python -m pip install dist/*.whl
          /tmp/datagovops-rc/bin/python - <<'PY'
          import datagovops

          assert datagovops.__version__ == "0.9.0"
          assert datagovops.RELEASE_VERSION == "0.9.0"
          assert datagovops.__all__
          print(datagovops.__version__)
          PY
          /tmp/datagovops-rc/bin/datagovops --version
