name: Stable Release Gate

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  stable-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install stable candidate and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Emit and verify frozen release contract
        run: python tools/release_contract.py --emit --verify
      - name: Run frozen-contract regression tests
        run: python -m unittest tests.test_contracts -v
      - name: Verify publication policy and fail-closed negative paths
        run: python -m unittest tests.test_publish_release -v
      - name: Verify compatibility and governance policy documents
        run: |
          test -s COMPATIBILITY.md
          test -s release/release-contract.json
          test -s release/repository-governance.json
          test -s release/publish-policy.json
          test -s release/v1.0.0-notes.md
          test -s docs/RELEASE_PROCESS.md
          grep -F '"release_stage": "stable"' release/release-contract.json
          grep -F '"current_release_version": "1.0.0"' release/release-contract.json
          grep -F 'enforcement_verified' release/repository-governance.json
          grep -F 'requires_human_release_decision' release/release-contract.json
          grep -F '"authorized": true' release/publish-policy.json
          grep -F '"package_index_publication_authorized": false' release/publish-policy.json
          grep -F '"deployment_authorized": false' release/publish-policy.json
      - name: Build stable-reference wheel
        run: python -m pip install build && python -m build --wheel
      - name: Clean-wheel stable-reference smoke
        run: |
          python -m venv /tmp/datagovops-stable
          /tmp/datagovops-stable/bin/python -m pip install dist/*.whl
          /tmp/datagovops-stable/bin/python - <<'PY'
          import datagovops

          assert datagovops.__version__ == "1.0.0"
          assert datagovops.RELEASE_VERSION == "1.0.0"
          assert datagovops.__all__
          print(datagovops.__version__)
          PY
          /tmp/datagovops-stable/bin/datagovops --version
