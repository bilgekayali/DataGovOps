name: Security Boundary

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run security boundary tests
        run: python -m unittest tests.test_security_boundary -v
      - name: Validate strict security schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          schema = json.loads(Path('schemas/security-boundary.schema.json').read_text(encoding='utf-8'))
          jsonschema.Draft202012Validator.check_schema(schema)
          defs = schema['$defs']
          for name in ('institution_context','identity_policy','encrypted_evidence','security_observation'):
              assert defs[name]['additionalProperties'] is False
          assert defs['encrypted_evidence']['properties']['production_key_management_validated']['const'] is False
          assert defs['security_observation']['properties']['production_observability_validated']['const'] is False
          PY
      - name: Validate PostgreSQL RLS reference
        run: |
          grep -F "NOBYPASSRLS" deployment/postgresql-institution-rls.sql
          grep -F "FORCE ROW LEVEL SECURITY" deployment/postgresql-institution-rls.sql
          grep -F "current_setting('datagovops.institution_id', true)" deployment/postgresql-institution-rls.sql
          grep -F "WITH CHECK" deployment/postgresql-institution-rls.sql
          grep -F "REVOKE ALL ON datagovops_evidence FROM PUBLIC" deployment/postgresql-institution-rls.sql
      - name: Verify offline identity boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('src/datagovops/security.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          banned = {'requests','urllib','http','socket','subprocess'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  roots = {a.name.split('.')[0] for a in node.names}
              elif isinstance(node, ast.ImportFrom) and node.module:
                  roots = {node.module.split('.')[0]}
              else:
                  continue
              if roots & banned:
                  raise SystemExit(f'{path}: forbidden network/process capability import')
          PY
      - name: Clean-wheel security smoke
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/datagovops-security-smoke
          /tmp/datagovops-security-smoke/bin/python -m pip install dist/*.whl
          /tmp/datagovops-security-smoke/bin/python - <<'PY'
          from datagovops import InstitutionContext, IdentityPolicy, EvidenceKeyReference
          assert InstitutionContext is not None
          assert IdentityPolicy is not None
          assert EvidenceKeyReference is not None
          PY
