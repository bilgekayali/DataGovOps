[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datagovops"
version = "0.1.0"
description = "Evidence-backed data governance, classification, and accountability for regulated financial institutions"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bilge Kayalı" }]
license = { text = "Apache-2.0" }
dependencies = []
keywords = ["data-governance", "bcbs239", "gdpr", "data-quality", "banking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
