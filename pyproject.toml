[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datagovops"
version = "0.8.0"
description = "Evidence-backed data governance, classification, accountability, and reporting assurance for regulated financial institutions"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bilge Kayalı" }]
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=43,<47",
  "jsonschema>=4.23,<5",
]
keywords = ["data-governance", "bcbs239", "gdpr", "data-quality", "banking", "regulatory-reporting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = []

[project.scripts]
datagovops = "datagovops.cli:main"

[tool.setuptools]
package-dir = {"" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
